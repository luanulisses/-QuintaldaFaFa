# =============================================================================
# Supabase Edge Functions — Configuração de JWT
# O Mercado Pago envia webhooks SEM cabeçalho Authorization.
# Por isso, as funções que recebem chamadas externas precisam de verify_jwt = false.
# =============================================================================

[functions.mercadopago-webhook]
verify_jwt = false

[functions.mercadopago-verify]
verify_jwt = false

[functions.mercadopago-pix]
verify_jwt = false

[functions.mercadopago-checkout]
verify_jwt = false

[functions.mercadopago-cc]
verify_jwt = false
